[project]
name = "deal-scanner-manual"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["deal-scanner-core", "deal-scanner-provider-sdk"]

[tool.uv.sources]
deal-scanner-core = { workspace = true }
deal-scanner-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_scanner_manual"]
