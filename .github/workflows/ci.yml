name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and PostgreSQL isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deal_scanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deal_scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEAL_SCANNER_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/deal_scanner_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - name: Validate Docker Compose model
        run: docker compose config --quiet
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with: { enable-cache: true }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/python apps/server-api apps/scheduler apps/analysis-worker providers tests/test_postgres_rls.py
      - run: uv run pytest --cov --cov-report=term-missing
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify generated contracts
        run: |
          pnpm openapi:export
          pnpm contracts:generate
          git diff --exit-code -- schemas/openapi.json packages/typescript/contracts/src/generated.ts

  container-smoke:
    name: Container smoke (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, scheduler, worker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64
          push: false
