[project]
name = "deal-scanner-marketplace-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["deal-scanner-kleinanzeigen-web", "deal-scanner-core", "deal-scanner-provider-sdk", "scrapling==0.4.15", "httpx>=0.28,<1"]

[tool.uv.sources]
deal-scanner-kleinanzeigen-web = { workspace = true }
deal-scanner-core = { workspace = true }
deal-scanner-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_scanner_marketplace_web"]
