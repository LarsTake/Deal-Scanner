<!doctype html>
<html lang="de">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal Scanner</title>
    <style>body{font:14px system-ui;width:340px;padding:18px;background:#0c1513;color:#eef8f5}label{display:block;margin:12px 0 4px;color:#9aafa8}input{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #2a3a36;background:#13201d;color:inherit}button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:9px;background:#57e6ae;font-weight:800;cursor:pointer}.secondary{background:transparent;color:#57e6ae;border:1px solid #57e6ae}small{display:block;margin-top:12px;color:#9aafa8;line-height:1.4}</style>
  </head>
  <body>
    <strong>Deal Scanner · Universal Import</strong>
    <button id="activate" class="secondary">Auf dieser Website aktivieren</button>
    <label for="api">API-Adresse</label><input id="api" value="http://127.0.0.1:8000">
    <label for="token">Access- oder Geräte-Token</label><input id="token" type="password">
    <button id="save">Verbindung speichern</button>
    <small id="status">Nach der Aktivierung erscheint auf der Website eine Queue mit jedem erkannten Angebot und seinem Importstatus. Die KI-Analyse läuft sicher im Deal-Scanner-Backend.</small>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
