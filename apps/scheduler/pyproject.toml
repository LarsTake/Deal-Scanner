[project]
name = "deal-scanner-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "deal-scanner-core",
  "deal-scanner-extraction",
  "deal-scanner-service-auth",
  "deal-scanner-ebay",
  "deal-scanner-email",
  "deal-scanner-kleinanzeigen-web",
  "deal-scanner-marketplace-web",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<27",
  "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
deal-scanner-core = { workspace = true }
deal-scanner-extraction = { workspace = true }
deal-scanner-service-auth = { workspace = true }
deal-scanner-ebay = { workspace = true }
deal-scanner-email = { workspace = true }
deal-scanner-kleinanzeigen-web = { workspace = true }
deal-scanner-marketplace-web = { workspace = true }

[project.scripts]
deal-scanner-scheduler = "deal_scanner_scheduler.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_scanner_scheduler"]
