name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deal_scanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deal_scanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEAL_SCANNER_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/deal_scanner_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/python apps/server-api apps/scheduler apps/analysis-worker providers tests/test_postgres_rls.py
      - run: uv run pytest --cov --cov-report=term-missing
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify generated contracts
        run: |
          pnpm openapi:export
          pnpm contracts:generate
          git diff --exit-code -- schemas/openapi.json packages/typescript/contracts/src/generated.ts
