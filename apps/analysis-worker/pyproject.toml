[project]
name = "deal-scanner-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "deal-scanner-core",
  "deal-scanner-extraction",
  "deal-scanner-service-auth",
  "httpx>=0.28,<1",
  "pillow>=11.3,<13",
  "psutil>=7.0,<8",
  "pytesseract>=0.3.13,<1",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<27",
]

[tool.uv.sources]
deal-scanner-core = { workspace = true }
deal-scanner-extraction = { workspace = true }
deal-scanner-service-auth = { workspace = true }

[project.scripts]
deal-scanner-worker = "deal_scanner_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_scanner_worker"]
