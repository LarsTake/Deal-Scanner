[project]
name = "deal-scanner-extraction"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "deal-scanner-core",
  "deal-scanner-scoring",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.13,<4",
  "pillow>=11.3,<13",
  "imagehash>=4.3,<5",
]

[tool.uv.sources]
deal-scanner-core = { workspace = true }
deal-scanner-scoring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_scanner_extraction"]
