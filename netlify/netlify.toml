[build]
  command = "pnpm --filter @deal-scanner/ebay-compliance build"
  publish = "netlify/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/v1/webhooks/ebay/account-deletion"
  to = "/.netlify/functions/ebay-account-deletion"
  status = 200
  force = true

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
