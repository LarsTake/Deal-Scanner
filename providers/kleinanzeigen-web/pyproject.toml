[project]
name = "deal-scanner-kleinanzeigen-web"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "deal-scanner-core",
  "deal-scanner-provider-sdk",
  "httpx>=0.28,<1",
  "scrapling==0.4.15",
]

[tool.uv.sources]
deal-scanner-core = { workspace = true }
deal-scanner-provider-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_scanner_kleinanzeigen_web"]
