[project]
name = "deal-scanner-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "deal-scanner-core",
  "deal-scanner-extraction",
  "deal-scanner-scoring",
  "deal-scanner-ebay",
  "deal-scanner-manual",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "truststore>=0.10.4,<1",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
deal-scanner-core = { workspace = true }
deal-scanner-extraction = { workspace = true }
deal-scanner-scoring = { workspace = true }
deal-scanner-ebay = { workspace = true }
deal-scanner-manual = { workspace = true }

[project.scripts]
deal-scanner-api = "deal_scanner_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deal_scanner_api"]
